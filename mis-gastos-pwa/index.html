<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Gastos">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mis Gastos</title>
<style>
:root{
  --bg:#f4f6f5;--card:#fff;--text:#14201d;--muted:#6b7b76;--line:#e3e9e6;
  --brand:#0f766e;--brand2:#14b8a6;--out:#dc2626;--in:#16a34a;--chip:#eef3f1;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1514;--card:#17211f;--text:#e8f0ed;--muted:#8fa19b;--line:#25332f;--chip:#1f2c29;--out:#f87171;--in:#4ade80}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 70px}
.top{display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:18px;margin:0;font-weight:700}
.icon-btn{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:12px;padding:8px 12px;font-size:14px}
.month{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px}
.month button{background:rgba(255,255,255,.18);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px}
.month span{min-width:140px;text-align:center;font-weight:600;text-transform:capitalize}
.balance{text-align:center;margin-top:10px}
.balance small{opacity:.85}
.balance .big{font-size:34px;font-weight:800;letter-spacing:-.5px}
main{margin-top:-48px;padding:0 14px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:14px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum div{background:var(--chip);border-radius:14px;padding:10px 12px}
.sum small{color:var(--muted);display:block;font-size:12px}
.sum b{font-size:17px}
.sum .o b{color:var(--out)}.sum .i b{color:var(--in)}
h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.cat-row{margin-bottom:10px}
.cat-row .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.day{font-size:12px;color:var(--muted);font-weight:600;margin:14px 4px 6px;text-transform:capitalize}
.tx{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.emo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:var(--chip);flex:none}
.tx .m{flex:1;min-width:0}
.tx .m b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .m small{color:var(--muted)}
.amt{font-weight:700;font-size:15px;white-space:nowrap}
.amt.out{color:var(--out)}.amt.in{color:var(--in)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(15,118,110,.5)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:10}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:transparent;padding:10px;border-radius:9px;font-weight:600;color:var(--muted);font-size:15px}
.seg button.on.out{background:var(--out);color:#fff}
.seg button.on.in{background:var(--in);color:#fff}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
input.amount{font-size:26px;font-weight:700}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cats button{border:2px solid transparent;background:var(--chip);border-radius:12px;padding:8px 2px;font-size:11px;color:var(--text)}
.cats button span{display:block;font-size:22px}
.cats button.on{border-color:var(--brand)}
.actions{display:flex;gap:10px;margin-top:16px}
.actions button{flex:1;padding:14px;border-radius:14px;border:0;font-size:16px;font-weight:700}
.save{background:var(--brand);color:#fff}
.cancel{background:var(--chip);color:var(--text)}
.del{background:#fee2e2;color:#b91c1c;flex:0 0 auto!important}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.toast.show{opacity:1}
.menu button{width:100%;text-align:left;padding:14px;border:0;background:var(--chip);border-radius:12px;margin-bottom:8px;font-size:15px;color:var(--text)}
</style>
</head>
<body>
<header>
  <div class="top"><h1>💰 Mis Gastos</h1><button class="icon-btn" id="menuBtn">⋯ Más</button></div>
  <div class="month"><button id="prev">‹</button><span id="monthLabel"></span><button id="next">›</button></div>
  <div class="balance"><small>Balance del mes</small><div class="big" id="balance">$0</div></div>
</header>
<main>
  <div class="card"><div class="sum">
    <div class="i"><small>Ingresos</small><b id="inc">$0</b></div>
    <div class="o"><small>Gastos</small><b id="exp">$0</b></div>
  </div></div>
  <div class="card" id="catCard"><h2>Gastos por categoría</h2><div id="cats"></div></div>
  <div class="card"><h2>Movimientos</h2><div id="list"></div></div>
</main>
<button class="fab" id="fab" aria-label="Agregar">+</button>

<div class="sheet-bg" id="formBg"><div class="sheet">
  <h3 id="formTitle">Nuevo movimiento</h3>
  <div class="seg"><button id="tOut" class="on out">Gasto</button><button id="tIn">Ingreso</button></div>
  <label>Monto</label>
  <input class="amount" id="fAmount" type="text" inputmode="numeric" placeholder="0" autocomplete="off">
  <label>Categoría</label>
  <div class="cats" id="fCats"></div>
  <label>Descripción (opcional)</label>
  <input id="fNote" type="text" placeholder="Ej: almuerzo con Ana" maxlength="60">
  <label>Fecha</label>
  <input id="fDate" type="date">
  <div class="actions">
    <button class="del" id="fDel" style="display:none">🗑</button>
    <button class="cancel" id="fCancel">Cancelar</button>
    <button class="save" id="fSave">Guardar</button>
  </div>
</div></div>

<div class="sheet-bg" id="menuBg"><div class="sheet menu">
  <h3>Opciones</h3>
  <button id="mCsv">📄 Exportar CSV (todos los datos)</button>
  <button id="mBackup">💾 Descargar copia de seguridad (JSON)</button>
  <button id="mRestore">📥 Restaurar copia de seguridad</button>
  <button id="mClear">⚠️ Borrar todos los datos</button>
  <button id="mClose" style="background:var(--brand);color:#fff;text-align:center">Cerrar</button>
  <input type="file" id="file" accept="application/json" style="display:none">
</div></div>
<div class="toast" id="toast"></div>

<script>
const CATS_OUT=[
 {id:'comida',n:'Comida',e:'🍽️',c:'#f97316'},{id:'mercado',n:'Mercado',e:'🛒',c:'#84cc16'},
 {id:'transporte',n:'Transporte',e:'🚌',c:'#3b82f6'},{id:'hogar',n:'Hogar',e:'🏠',c:'#a855f7'},
 {id:'servicios',n:'Servicios',e:'💡',c:'#eab308'},{id:'salud',n:'Salud',e:'💊',c:'#ef4444'},
 {id:'ocio',n:'Ocio',e:'🎬',c:'#ec4899'},{id:'ropa',n:'Ropa',e:'👕',c:'#14b8a6'},
 {id:'educacion',n:'Educación',e:'📚',c:'#6366f1'},{id:'deudas',n:'Deudas',e:'💳',c:'#64748b'},
 {id:'regalos',n:'Regalos',e:'🎁',c:'#f43f5e'},{id:'otros',n:'Otros',e:'📦',c:'#78716c'}
];
const CATS_IN=[
 {id:'salario',n:'Salario',e:'💼',c:'#16a34a'},{id:'freelance',n:'Freelance',e:'💻',c:'#0ea5e9'},
 {id:'ventas',n:'Ventas',e:'🏷️',c:'#f59e0b'},{id:'regalo_in',n:'Regalo',e:'🎉',c:'#ec4899'},
 {id:'otros_in',n:'Otros',e:'➕',c:'#78716c'}
];
const ALL=[...CATS_OUT,...CATS_IN];
const KEY='gastos.v1';
let tx=[];try{tx=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(tx))}catch(e){toast('No se pudo guardar')}};
const $=id=>document.getElementById(id);
const fmt=n=>'$'+Math.round(n).toLocaleString('es-CO');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let cur=new Date();cur.setDate(1);
let form={type:'out',cat:'comida',id:null};

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
const monthKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');

function render(){
  const mk=monthKey(cur);
  $('monthLabel').textContent=cur.toLocaleDateString('es-CO',{month:'long',year:'numeric'});
  const items=tx.filter(t=>t.date.startsWith(mk)).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  const inc=items.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0);
  const exp=items.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0);
  $('inc').textContent=fmt(inc);$('exp').textContent=fmt(exp);
  const bal=inc-exp;$('balance').textContent=(bal<0?'-':'')+fmt(Math.abs(bal));
  // categorías
  const by={};items.filter(t=>t.type==='out').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  $('catCard').style.display=rows.length?'block':'none';
  $('cats').innerHTML=rows.map(([id,v])=>{
    const c=ALL.find(x=>x.id===id)||CATS_OUT[11];const p=exp?v/exp*100:0;
    return `<div class="cat-row"><div class="l"><span>${c.e} ${c.n}</span><span><b>${fmt(v)}</b> · ${p.toFixed(0)}%</span></div><div class="bar"><i style="width:${p}%;background:${c.c}"></i></div></div>`}).join('');
  // lista
  if(!items.length){$('list').innerHTML='<div class="empty">Sin movimientos este mes.<br>Toca <b>+</b> para agregar uno.</div>';return}
  let html='',last='';
  items.forEach(t=>{
    if(t.date!==last){last=t.date;const d=new Date(t.date+'T00:00:00');
      html+=`<div class="day">${d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'short'})}</div>`}
    const c=ALL.find(x=>x.id===t.cat)||CATS_OUT[11];
    html+=`<div class="tx" data-id="${t.id}"><div class="emo">${c.e}</div><div class="m"><b>${esc(t.note||c.n)}</b><small>${c.n}</small></div><div class="amt ${t.type}">${t.type==='out'?'-':'+'}${fmt(t.amount)}</div></div>`;
  });
  $('list').innerHTML=html;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderFormCats(){
  const list=form.type==='out'?CATS_OUT:CATS_IN;
  if(!list.find(c=>c.id===form.cat))form.cat=list[0].id;
  $('fCats').innerHTML=list.map(c=>`<button data-c="${c.id}" class="${c.id===form.cat?'on':''}"><span>${c.e}</span>${c.n}</button>`).join('');
}
function setType(t){form.type=t;
  $('tOut').className=t==='out'?'on out':'';$('tIn').className=t==='in'?'on in':'';renderFormCats()}
function openForm(id){
  const t=id?tx.find(x=>x.id===id):null;
  form.id=id||null;
  form.type=t?t.type:'out';form.cat=t?t.cat:'comida';
  $('formTitle').textContent=t?'Editar movimiento':'Nuevo movimiento';
  $('fAmount').value=t?t.amount.toLocaleString('es-CO'):'';
  $('fNote').value=t?t.note:'';
  $('fDate').value=t?t.date:today();
  $('fDel').style.display=t?'block':'none';
  setType(form.type);
  $('formBg').classList.add('open');
  if(!t)setTimeout(()=>$('fAmount').focus(),200);
}
const closeForm=()=>$('formBg').classList.remove('open');

$('fab').onclick=()=>openForm();
$('fCancel').onclick=closeForm;
$('formBg').onclick=e=>{if(e.target.id==='formBg')closeForm()};
$('tOut').onclick=()=>setType('out');$('tIn').onclick=()=>setType('in');
$('fCats').onclick=e=>{const b=e.target.closest('button');if(!b)return;form.cat=b.dataset.c;renderFormCats()};
$('fAmount').oninput=e=>{const n=e.target.value.replace(/\D/g,'');e.target.value=n?Number(n).toLocaleString('es-CO'):''};
$('fSave').onclick=()=>{
  const amount=Number($('fAmount').value.replace(/\D/g,''));
  if(!amount){toast('Ingresa un monto');return}
  const date=$('fDate').value||today();
  const rec={id:form.id||('t'+Date.now()+Math.random().toString(36).slice(2,6)),ts:Date.now(),type:form.type,cat:form.cat,amount,note:$('fNote').value.trim(),date};
  if(form.id){tx=tx.map(t=>t.id===form.id?{...t,...rec,ts:t.ts}:t)}else tx.push(rec);
  save();closeForm();
  const d=new Date(date+'T00:00:00');cur=new Date(d.getFullYear(),d.getMonth(),1);
  render();toast('Guardado ✓');
};
$('fDel').onclick=()=>{if(confirm('¿Eliminar este movimiento?')){tx=tx.filter(t=>t.id!==form.id);save();closeForm();render();toast('Eliminado')}};
$('list').onclick=e=>{const r=e.target.closest('.tx');if(r)openForm(r.dataset.id)};
$('prev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
$('next').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};

// menú
$('menuBtn').onclick=()=>$('menuBg').classList.add('open');
$('mClose').onclick=()=>$('menuBg').classList.remove('open');
$('menuBg').onclick=e=>{if(e.target.id==='menuBg')$('menuBg').classList.remove('open')};
function download(name,content,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('mCsv').onclick=()=>{
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=[['Fecha','Tipo','Categoría','Descripción','Monto']].concat(
    [...tx].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==='out'?'Gasto':'Ingreso',(ALL.find(c=>c.id===t.cat)||{}).n||t.cat,t.note,t.amount]));
  download('gastos.csv','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');toast('CSV descargado');
};
$('mBackup').onclick=()=>{download('gastos-backup-'+today()+'.json',JSON.stringify(tx),'application/json');toast('Copia descargada')};
$('mRestore').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;
    if(confirm('Esto reemplazará tus datos actuales ('+d.length+' movimientos). ¿Continuar?')){tx=d;save();render();$('menuBg').classList.remove('open');toast('Restaurado ✓')}}
    catch(_){toast('Archivo inválido')}};
  r.readAsText(f);e.target.value='';
};
$('mClear').onclick=()=>{if(confirm('¿Borrar TODOS los movimientos? No se puede deshacer.')){tx=[];save();render();$('menuBg').classList.remove('open');toast('Datos borrados')}};

render();
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
